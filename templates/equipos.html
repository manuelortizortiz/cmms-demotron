<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Maestro de Equipos</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<div class="topbar">
  <div class="logo">DEMOTRON</div>
  <nav class="nav">
    <a href="/">▦ Dashboard</a>
    <a class="active" href="/equipos">⚙ Equipos</a>
    <a href="/lecturas">▤ Lecturas</a>
    <a href="/mantenciones">🧰 Mantenciones</a>
    <a href="/historial">📚 Historial</a>
    <a href="/proyeccion">📈 Proyección</a>
  </nav>
  <input class="search" placeholder="Buscar...">
  <div class="user">{{user}} ▾</div>
  <a class="btn" href="/logout">Salir</a>
</div>

<main class="data-page">
  <div class="data-head">
    <h2>Maestro de Equipos</h2>
    <a class="btn" href="/admin/importar-cmms">Reimportar CMMS</a>
  </div>
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Código</th>
          <th>Tipo de Equipo</th>
          <th>Familia</th>
          <th>Marca</th>
          <th>Modelo</th>
          <th>Año</th>
          <th>Ubicación</th>
          <th>Responsable</th>
          <th>Lectura Actual</th>
          <th>Unidad</th>
          <th>Próxima PM</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody id="tablaEquipos"></tbody>
    </table>
  </div>
</main>
<script src="/static/js/equipos.js"></script>
</body>
</html>
