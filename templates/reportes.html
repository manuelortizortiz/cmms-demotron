{% extends 'base.html' %}{% block content %}<div class="grid"><div class="panel"><h3>REPORTE FLOTA</h3><canvas id="r1" class="canvas"></canvas></div><div class="panel"><h3>COSTO PM</h3><canvas id="r2" class="canvas"></canvas></div><div class="panel"><h3>RESUMEN</h3><table class="table"><tr><td>Total equipos</td><td><b>{{kpis.total}}</b></td></tr><tr><td>Atrasados</td><td>{{kpis.atrasados}}</td></tr><tr><td>Próximos</td><td>{{kpis.proximos}}</td></tr><tr><td>Controlado</td><td>{{kpis.controlado}}%</td></tr></table></div></div><script>new Chart(document.getElementById('r1'),{type:'bar',data:{labels:['Controlado','Próximos','Atrasados'],datasets:[{data:[{{kpis.total-kpis.atrasados-kpis.proximos}},{{kpis.proximos}},{{kpis.atrasados}}]}]}});new Chart(document.getElementById('r2'),{type:'line',data:{labels:[{% for e in equipos[:10] %}'{{e.codigo}}',{% endfor %}],datasets:[{label:'Costo PM',data:[{% for e in equipos[:10] %}{{e.costo_total_pm or 0}},{% endfor %}]}]}});</script>{% endblock %}
