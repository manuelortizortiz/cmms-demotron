<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEMOTRON ERP CMMS - Login</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#082b5f,#0c3f86);font-family:Segoe UI,Arial,sans-serif;color:#0f172a}
.card{width:min(430px,92vw);background:#fff;border-radius:18px;box-shadow:0 22px 70px rgba(0,0,0,.25);padding:36px}
.logo{font-size:34px;font-weight:950;letter-spacing:12px;color:#082b5f;text-align:center;margin-bottom:8px}
.sub{text-align:center;color:#64748b;margin-bottom:28px;font-weight:700}
input{width:100%;height:48px;border:1px solid #dbe3ef;border-radius:10px;margin-bottom:12px;padding:0 14px;font-size:15px;box-sizing:border-box}
button{width:100%;height:48px;border:0;border-radius:10px;background:#082b5f;color:white;font-weight:900;font-size:15px;cursor:pointer}
.err{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;padding:10px;border-radius:10px;margin-bottom:12px;font-weight:700}
.help{margin-top:18px;color:#64748b;font-size:13px;text-align:center;line-height:1.6}
.v{margin-top:12px;text-align:center;color:#15803d;font-weight:900;font-size:12px}
</style>
</head>
<body>
<form class="card" method="post">
  <div class="logo">DEMOTRON</div>
  <div class="sub">ERP CMMS Industrial · Visual V2</div>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <input name="username" placeholder="Usuario" autocomplete="username" required>
  <input name="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
  <button>Entrar al Dashboard</button>
  <div class="help">admin / admin123<br>gerencia / gerencia123<br>mantencion / mantencion123</div>
  <div class="v">VISUAL V2 ACTIVO</div>
</form>
</body>
</html>
