<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · DEMOTRON CMMS</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#072C61,#0F3B8E);font-family:Inter,Segoe UI,Arial,sans-serif;color:#111827}.card{width:min(430px,92vw);background:#fff;border-radius:28px;padding:34px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.logo{color:#0F3B8E;font-size:30px;font-weight:800;letter-spacing:6px;margin-bottom:8px}h1{margin:0;color:#072C61}p{color:#6B7280}input{width:100%;border:1px solid #E5E7EB;border-radius:14px;padding:14px;margin:8px 0;font:inherit}button{width:100%;border:0;background:#0F3B8E;color:white;border-radius:999px;padding:14px;margin-top:12px;font-weight:700;cursor:pointer}.error{background:#FEE2E2;color:#B91C1C;border-radius:12px;padding:10px;margin:10px 0}small{display:block;margin-top:18px;color:#6B7280;line-height:1.5}</style></head>
<body><form class="card" method="post"><div class="logo">DEMOTRON</div><h1>CMMS Empresa</h1><p>Acceso protegido por usuario y rol.</p>{% with messages=get_flashed_messages() %}{% if messages %}<div class="error">{{ messages[0] }}</div>{% endif %}{% endwith %}<input name="username" placeholder="Usuario" required><input name="password" type="password" placeholder="Contraseña" required><button>Ingresar</button><small>Usuarios iniciales:<br>admin / admin123<br>gerencia / gerencia123<br>mantencion / mantencion123<br>bodega / bodega123<br>lectura / lectura123</small></form></body></html>
