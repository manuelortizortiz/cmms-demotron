<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEMOTRON ERP CMMS</title><style>
:root{--bg:#07111f;--card:#101b2d;--line:#243551;--txt:#eef5ff;--mut:#90a4c2;--brand:#1f6feb;--brand2:#00d4ff}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 20% 10%,#12325e,transparent 30%),linear-gradient(135deg,#050b14,#0c1628 55%,#101827);min-height:100vh;color:var(--txt);display:grid;place-items:center}.login{width:min(440px,92vw);background:rgba(16,27,45,.88);border:1px solid var(--line);border-radius:28px;box-shadow:0 24px 80px #0008;padding:34px}.logo{display:flex;gap:14px;align-items:center;margin-bottom:24px}.mark{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-weight:900;font-size:24px}.small{color:var(--mut);font-size:13px;letter-spacing:.18em;text-transform:uppercase}h1{margin:4px 0 8px;font-size:32px}.sub{color:var(--mut);margin-bottom:24px}label{font-size:13px;color:#b9c8df}input{width:100%;margin:7px 0 16px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#07111f;color:var(--txt);outline:none}button{width:100%;padding:15px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:white;font-weight:800;cursor:pointer}.err{background:#351923;color:#ffb6c1;border:1px solid #7a2638;padding:12px;border-radius:14px;margin-bottom:14px}.demo{margin-top:18px;color:var(--mut);font-size:13px;line-height:1.6}.foot{margin-top:18px;color:#63758e;font-size:12px}</style></head><body><main class="login"><div class="logo"><div class="mark">D</div><div><div class="small">DEMOTRON MAQUINARIAS</div><h1>ERP CMMS</h1></div></div><p class="sub">Control industrial de equipos, OT, lecturas, compras, bodega y planificación.</p>{% if error %}<div class="err">{{error}}</div>{% endif %}<form method="post"><label>Usuario</label><input name="username" autocomplete="username" required value="admin"><label>Contraseña</label><input type="password" name="password" autocomplete="current-password" required value="admin123"><button>Entrar al sistema</button></form><div class="demo">Accesos iniciales: <b>admin/admin123</b>, gerencia/gerencia123, mantencion/mantencion123, bodega/bodega123.</div><div class="foot">{{ version }}</div></main></body></html>
