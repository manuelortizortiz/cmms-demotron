<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - DEMOTRON ERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 h-screen flex items-center justify-center font-['Roboto']">
    <div class="bg-white p-10 rounded-2xl shadow-xl w-96 border border-slate-200">
        <div class="text-center mb-8">
            <img src="{{ url_for('static', filename='ISOTIPO DEMOTRON.png') }}?v=2" class="h-16 mx-auto mb-4" alt="Logo">
            <h1 class="text-2xl font-bold text-[#082b5f]">DEMOTRON</h1>
            <p class="text-xs text-slate-500 uppercase tracking-widest">Acceso ERP CMMS</p>
        </div>
        
        {% if error %}
        <div class="bg-red-50 text-red-600 p-3 rounded mb-4 text-sm text-center border border-red-200">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-4">
                <label class="block text-xs font-medium text-slate-600 uppercase mb-1">Usuario</label>
                <input type="text" name="username" class="w-full px-4 py-2 border rounded-lg bg-slate-50 focus:bg-white focus:outline-none focus:border-blue-500" required>
            </div>
            <div class="mb-6">
                <label class="block text-xs font-medium text-slate-600 uppercase mb-1">Contraseña</label>
                <input type="password" name="password" class="w-full px-4 py-2 border rounded-lg bg-slate-50 focus:bg-white focus:outline-none focus:border-blue-500" required>
            </div>
            <button type="submit" class="w-full bg-[#082b5f] text-white font-medium py-3 rounded-lg hover:bg-[#103a7a] transition-colors">Ingresar al Sistema</button>
        </form>
    </div>
</body>
</html>
