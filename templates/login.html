<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login CMMS</title><style>body{margin:0;display:grid;place-items:center;min-height:100vh;background:#092b5c;font-family:Segoe UI,Arial}.box{width:360px;background:white;border-radius:14px;padding:30px;box-shadow:0 20px 60px #001b40}.logo{font-size:32px;letter-spacing:8px;font-weight:900;color:#092b5c;margin-bottom:8px}input{width:100%;padding:13px;margin:8px 0;border:1px solid #d9e0ec;border-radius:8px}button{width:100%;padding:13px;border:0;border-radius:8px;background:#092b5c;color:white;font-weight:800;margin-top:10px}.msg{color:#e11d48}</style></head><body><form class="box" method="post"><div class="logo">DEMOTRON</div><h2>CMMS Operacional</h2>{% with messages=get_flashed_messages() %}{% if messages %}<p class="msg">{{messages[0]}}</p>{% endif %}{% endwith %}<input name="username" placeholder="Usuario" value="admin"><input name="password" type="password" placeholder="Contraseña" value="admin123"><button>Entrar</button><p>Demo: admin / admin123</p></form></body></html>
