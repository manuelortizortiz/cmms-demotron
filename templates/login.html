<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEMOTRON CMMS</title><style>
:root{--azul:#082b5f;--azul2:#0b3f8a;--b:#edf1f7;--txt:#17213a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#082b5f,#f8fafc);font-family:Inter,Segoe UI,Arial;color:var(--txt);height:100vh;display:grid;place-items:center}.card{width:min(420px,92vw);background:white;border-radius:24px;padding:36px;box-shadow:0 20px 70px #061a3d55}.logo{letter-spacing:12px;font-size:32px;font-weight:900;color:var(--azul);margin-bottom:6px}.sub{color:#6b7280;margin-bottom:28px}label{font-size:13px;font-weight:800;color:#475569}input{width:100%;padding:14px 16px;border:1px solid #dbe3ef;border-radius:12px;margin:7px 0 16px;font-size:15px}button{width:100%;border:0;border-radius:14px;background:var(--azul);color:white;padding:15px;font-weight:900;font-size:15px}.err{background:#fee2e2;color:#b91c1c;padding:10px;border-radius:10px;margin-bottom:15px}.hint{font-size:12px;color:#64748b;margin-top:18px;text-align:center}</style></head><body><form class="card" method="post"><div class="logo">DEMOTRON</div><div class="sub">ERP CMMS Industrial</div>{% if error %}<div class="err">{{ error }}</div>{% endif %}<label>Usuario</label><input name="username" value="admin" autofocus><label>Contraseña</label><input type="password" name="password" value="admin123"><button>Entrar al Dashboard</button><div class="hint">admin / admin123 · {{ version }}</div></form></body></html>
