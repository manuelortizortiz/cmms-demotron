<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - DEMOTRON CMMS</title>
    <link rel="icon" href="{{ url_for('static', filename='ISOTIPO DEMOTRON.png') }}" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }</style>
</head>
<body class="flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm border border-slate-200">
        <div class="text-center mb-8">
            <img src="{{ url_for('static', filename='Logo Azul.png') }}" alt="Demotron" class="h-12 mx-auto mb-4" onerror="this.outerHTML='<h1 class=\'text-2xl font-bold text-blue-800\'>DEMOTRON</h1>';">
            <h2 class="text-lg font-bold text-slate-700">Acceso al Sistema</h2>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-4 p-3 rounded-lg text-sm text-center font-bold {% if category == 'danger' %}bg-red-50 text-red-600 border border-red-200{% else %}bg-blue-50 text-blue-600{% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Nombre de Usuario</label>
                <input type="text" name="username" class="w-full border border-slate-300 px-4 py-2 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required autofocus>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Contraseña</label>
                <input type="password" name="password" class="w-full border border-slate-300 px-4 py-2 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg text-sm hover:bg-blue-700 transition duration-200 mt-2">Ingresar a CMMS</button>
        </form>
        <p class="text-[10px] text-center text-slate-400 mt-6 uppercase tracking-wider">Demotron Maquinarias &copy; 2026</p>
    </div>
</body>
</html>
