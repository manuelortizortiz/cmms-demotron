<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Impresión OT</title>
    <style>
        body { font-family: sans-serif; font-size: 11px; margin: 20px; }
        table { width: 100%; border-collapse: collapse; border: 1px solid #000; }
        th, td { border: 1px solid #000; padding: 5px; }
        th { background: #eee; }
    </style>
</head>
<body onload="window.print()">
    <h2>Orden de Trabajo: {{ ot.folio }}</h2>
    <p>Equipo: {{ equipo.codigo }} | Tipo: {{ ot.tipo_mantencion }}</p>
    <table>
        <tr><th>Sistema</th><th>Fleetguard</th><th>Baldwind</th><th>Original</th><th>Donaldson</th></tr>
        {% for f in filtros %}
        <tr><td>{{ f.sistema }}</td><td>{{ f.fleetguard }}</td><td>{{ f.baldwind }}</td><td>{{ f.originales }}</td><td>{{ f.donaldson }}</td></tr>
        {% endfor %}
    </table>
</body>
</html>
